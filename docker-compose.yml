services:
  site:
    build:
      context: ./priv/private_ece_576_group_project
      dockerfile: site/Dockerfile
    environment:
      FLAG_SECRET: classroom-demo-v1
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  player:
    build: ./player
    environment:
      SITE: http://site:8080
    depends_on:
      - site
    stdin_open: true
    tty: true
