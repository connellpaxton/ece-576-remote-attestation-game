services:
  site:
    # The site source is intentionally private; use the public course image so
    # a fresh clone remains runnable without access to that submodule.
    image: ghcr.io/tinacheng2/meridian-cleanroom-site@sha256:6434402a3015a1a37a6d6499fc1f23b4587c3b139a4b4c004ed3c304106a2ded
    environment:
      FLAG_SECRET: classroom-demo-v1
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"

  player:
    build: ./player
    environment:
      SITE: http://site:8080
    depends_on:
      - site
    stdin_open: true
    tty: true
